
name: Build & Package AppImage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Lyricade
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-4-dev \
            libadwaita-1-dev \
            build-essential \
            libasound2-dev \
            pipewire-alsa

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Binary
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: lyricade-binary
          path: target/release/lyricade
          retention-days: 1

  package:
    name: Package AppImage
    needs: build
    runs-on: ubuntu-26.04

    # Anylinux's debloated packages require pacman.
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Binary
        uses: actions/download-artifact@v4
        with:
          name: lyricade-binary
          path: ./target/release

      - name: Install Packaging Dependencies
        run: |
          pacman -Syu --noconfirm

          pacman -S --needed --noconfirm \
            base-devel \
            binutils \
            coreutils \
            findutils \
            gawk \
            glibc \
            grep \
            gtk4 \
            libadwaita \
            patchelf \
            strace \
            tar \
            wget \
            zsync \
            alsa-lib \
            pipewire-alsa

          chmod +x ./target/release/lyricade

      - name: Install Debloated Mesa
        run: |
          wget --retry-connrefused --tries=30 \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/get-debloated-pkgs.sh \
            -O ./get-debloated-pkgs.sh

          chmod +x ./get-debloated-pkgs.sh

          ./get-debloated-pkgs.sh --add-opengl

      - name: Build AppImage
        env:
          ICON: ./data/icons/512x512.png
          DESKTOP: ./data/io.github.weiteck.Lyricade.desktop
          OUTPATH: ./dist
          OUTNAME: lyricade.AppImage
          DEPLOY_PIPEWIRE: "1"
          SHARUN: https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/main/useful-tools/quick-sharun.sh

        run: |
          mkdir -p ./dist

          wget --retry-connrefused --tries=30 \
            "$SHARUN" -O ./quick-sharun.sh

          chmod +x ./quick-sharun.sh

          ./quick-sharun.sh ./target/release/lyricade

          ./quick-sharun.sh --make-appimage

      - name: Test AppImage
        run: |
          ./quick-sharun.sh --test ./dist/lyricade.AppImage

      - name: Rename AppImage to include Git Tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mv ./dist/lyricade.AppImage \
             "./dist/lyricade-${TAG_NAME}-x86_64.AppImage"

      - name: Upload AppImage to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage

      - name: Save AppImage as Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lyricade-appimage
          path: dist/*.AppImage
          retention-days: 7
